<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <title>Vendas</title>
    <style>
      select {
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        background-color: #fff;
      }
      .alert {
        padding: 12px 16px;
        margin-bottom: 20px;
        border-radius: 4px;
        font-weight: bold;
      }
      .alert-success {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      .alert-error {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
      .badge {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 0.85rem;
        font-weight: bold;
      }
      .badge-aberto {
        background-color: #fff3cd;
        color: #856404;
      }
      .badge-fechado {
        background-color: #d4edda;
        color: #155724;
      }
      .btn-close-order {
        background-color: #0b2545;
        color: white;
      }
      .fatura-code {
        font-family: monospace;
        font-size: 0.85rem;
        background: #f1f1f1;
        padding: 2px 6px;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Gestão de Vendas</h1>
      <nav>
        <a th:href="@{/}">⬅ Voltar para o Início</a>
      </nav>
    </header>

    <main>
      <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
      <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

      <section>
        <h2>Novo Pedido de Venda</h2>
        <form th:action="@{/sales}" method="post">
          <div>
            <label for="productId">Produto:</label>
            <select id="productId" name="productId" required>
              <option value="" disabled selected>Selecione um produto...</option>
              <option th:each="p : ${products}" 
                      th:value="${p.id}" 
                      th:text="${p.name + ' (R$ ' + #numbers.formatDecimal(p.price, 1, 2, 'POINT') + ' | Estoque: ' + (p.quantity != null ? p.quantity : 0) + ')'}">
              </option>
            </select>
          </div>

          <div>
            <label for="quantity">Quantidade:</label>
            <input id="quantity" type="number" name="quantity" min="1" value="1" required />
          </div>

          <button type="submit" style="background-color: #28a745; color: white;">
            Criar Pedido
          </button>
        </form>
      </section>

      <section>
        <h2>Pedidos Realizados</h2>
        <table>
          <thead>
            <tr>
              <th>ID Pedido</th>
              <th>Produto</th>
              <th>Qtd.</th>
              <th>Valor Total (R$)</th>
              <th>Status</th>
              <th>ID da Fatura (Hub)</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr th:if="${#lists.isEmpty(sales)}">
              <td colspan="7" style="text-align: center;">Nenhuma venda realizada até o momento.</td>
            </tr>
            <tr th:each="sale : ${sales}">
              <td th:text="${sale.id}"></td>
              <td th:text="${sale.product.name}"></td>
              <td th:text="${sale.quantity}"></td>
              <td th:text="${#numbers.formatDecimal(sale.totalPrice, 1, 2, 'POINT')}"></td>
              <td>
                <span th:classappend="'badge badge-' + ${#strings.toLowerCase(sale.status)}"
                      th:text="${sale.status}">
                </span>
              </td>
              <td>
                <span th:if="${sale.faturaId != null}" class="fatura-code" th:text="${sale.faturaId}"></span>
                <span th:if="${sale.faturaId == null}" style="color: #6c757d;">Pendente de faturamento</span>
              </td>
              <td>
                <form th:if="${sale.status == 'ABERTO'}"
                      th:action="@{/sales/close/{id}(id=${sale.id})}" 
                      method="post" 
                      style="display:inline;">
                  <button type="submit" 
                          class="btn-close-order"
                          onclick="return confirm('Deseja fechar o pedido e enviar ao Hub de Faturamento?')">
                    Fechar Pedido
                  </button>
                </form>
                <span th:if="${sale.status == 'FECHADO'}" style="color: #28a745; font-weight: bold;">
                  Concluído
                </span>
              </td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>

    <footer>Projeto de compreensão do padrão MVC</footer>
  </body>
</html>
