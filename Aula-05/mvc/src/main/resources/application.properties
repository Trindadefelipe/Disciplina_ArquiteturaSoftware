spring.application.name=mvc
spring.thymeleaf.prefix=classpath:/view/
spring.thymeleaf.suffix=.html

# Configurações do Banco de Dados H2 em Memória
spring.datasource.url=jdbc:h2:mem:dundermifflin;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Web Console (/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console